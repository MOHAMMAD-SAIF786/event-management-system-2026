{% if messages %}
<div class="toast-container" id="globalToastContainer" aria-live="polite" aria-atomic="true">
  {% for message in messages %}
    <div class="luxury-toast toast-{{ message.tags|default:'info' }}" role="alert">
      <div class="toast-content">
        <div class="toast-icon">
          {% if message.tags == 'success' %}
            <i class="fa-solid fa-circle-check"></i>
          {% elif message.tags == 'error' or message.tags == 'danger' %}
            <i class="fa-solid fa-circle-xmark"></i>
          {% elif message.tags == 'warning' %}
            <i class="fa-solid fa-triangle-exclamation"></i>
          {% else %}
            <i class="fa-solid fa-circle-info"></i>
          {% endif %}
        </div>
        <div class="toast-text">
          {{ message }}
        </div>
      </div>
      <button type="button" class="toast-close-btn" onclick="dismissToast(this.closest('.luxury-toast'))" aria-label="Close notification">&times;</button>
    </div>
  {% endfor %}
</div>

<style>
.toast-container {
  position: fixed;
  top: 80px;
  right: 24px;
  z-index: 999999;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 380px;
  width: calc(100vw - 48px);
  pointer-events: none;
}

.luxury-toast {
  pointer-events: auto;
  background: #ffffff;
  color: #171717;
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.14), 0 2px 6px rgba(0, 0, 0, 0.06);
  border: 1px solid #e4e4e7;
  border-left: 5px solid #171717;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.45;
  animation: luxuryToastIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.luxury-toast .toast-content {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}

.luxury-toast .toast-icon {
  font-size: 17px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.luxury-toast .toast-text {
  color: #18181b;
  word-break: break-word;
}

.luxury-toast.toast-success {
  border-left-color: #16a34a;
}
.luxury-toast.toast-success .toast-icon {
  color: #16a34a;
}

.luxury-toast.toast-error,
.luxury-toast.toast-danger {
  border-left-color: #dc2626;
}
.luxury-toast.toast-error .toast-icon,
.luxury-toast.toast-danger .toast-icon {
  color: #dc2626;
}

.luxury-toast.toast-warning {
  border-left-color: #d97706;
}
.luxury-toast.toast-warning .toast-icon {
  color: #d97706;
}

.luxury-toast.toast-info {
  border-left-color: #2563eb;
}
.luxury-toast.toast-info .toast-icon {
  color: #2563eb;
}

.toast-close-btn {
  background: transparent;
  border: none;
  font-size: 20px;
  line-height: 1;
  color: #a1a1aa;
  cursor: pointer;
  padding: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  transition: all 0.15s ease;
  flex-shrink: 0;
}

.toast-close-btn:hover {
  color: #18181b;
  background: #f4f4f5;
}

@keyframes luxuryToastIn {
  from {
    opacity: 0;
    transform: translateX(40px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}
</style>

<script>
function dismissToast(toastEl) {
  if (!toastEl) return;
  toastEl.style.opacity = '0';
  toastEl.style.transform = 'translateX(40px) scale(0.95)';
  setTimeout(function() {
    toastEl.remove();
  }, 260);
}

document.addEventListener('DOMContentLoaded', function() {
  var toasts = document.querySelectorAll('.luxury-toast');
  toasts.forEach(function(toast) {
    setTimeout(function() {
      dismissToast(toast);
    }, 4500);
  });
});
</script>
{% endif %}
