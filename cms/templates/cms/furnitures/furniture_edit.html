{% extends 'cms/base.html' %}
{% load static %}

{% block title %}
  Edit Furniture - CMS
{% endblock %}

{% block content %}
<div class="dashboard-container">
  <div class="page-header">
    <div>
      <h1><i class="fa-solid fa-pen-to-square"></i> Edit Furniture Item</h1>
      <p>Update pricing, quantities, and properties for <strong>{{ item.name }}</strong></p>
    </div>
    <a href="{% url 'cms:furniture_list' %}" class="btn-expo-secondary">
      <i class="fa-solid fa-arrow-left"></i> Back to Furniture List
    </a>
  </div>

  <div class="expo-card" style="max-width: 640px; margin: 0 auto;">
    <form method="POST" action="{% url 'cms:furniture_edit' item.id %}">
      {% csrf_token %}

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px;">Furniture Name</label>
        <input type="text" name="name" value="{{ item.name }}" required class="expo-input" />
      </div>

      <div style="display: flex; gap: 16px; margin-bottom: 16px;">
        <div style="flex: 1;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px;">Price (₹)</label>
          <input type="number" step="0.01" name="price" value="{{ item.price }}" required class="expo-input" />
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px;">Unit (e.g. pcs, set)</label>
          <input type="text" name="unit" value="{{ item.unit }}" required class="expo-input" />
        </div>
      </div>

      <div style="display: flex; gap: 16px; margin-bottom: 16px;">
        <div style="flex: 1;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px;">Default Quantity</label>
          <input type="number" name="default_quantity" value="{{ item.default_quantity }}" class="expo-input" />
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px;">Min Quantity</label>
          <input type="number" name="min_quantity" value="{{ item.min_quantity|default:'' }}" class="expo-input" />
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px;">Max Quantity</label>
          <input type="number" name="max_quantity" value="{{ item.max_quantity|default:'' }}" class="expo-input" />
        </div>
      </div>

      <div style="margin-bottom: 24px;">
        <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-main); cursor: pointer;">
          <input type="checkbox" name="is_required" {% if item.is_required %}checked{% endif %} style="width: 18px; height: 18px; accent-color: var(--primary);" />
          Is Mandatory/Required Item
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <a href="{% url 'cms:furniture_list' %}" class="btn-expo-secondary">Cancel</a>
        <button type="submit" class="btn-expo-primary">
          <i class="fa-solid fa-save"></i> Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
