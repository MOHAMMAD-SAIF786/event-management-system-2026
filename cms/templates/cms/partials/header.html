<header class="topbar">
  <div class="topbar-left">
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="topbar-brand">
      <h2>Royal<span class="logo-accent">CMS</span></h2>
    </div>
  </div>

  <div class="topbar-right">
    <a href="{% url 'halls_list' %}" target="_blank" class="topbar-client-link" title="View Public Website">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
      <span>Public Site</span>
    </a>

    <div class="admin-profile">
      <div class="admin-avatar">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div class="admin-info">
        <h4>{% if user.is_authenticated %}{{ user.username|title }}{% else %}Admin{% endif %}</h4>
        <span>Super Administrator</span>
      </div>
    </div>
  </div>
</header>
