<!-- Custom Expo Delete Confirmation Modal -->
<div id="expoDeleteModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 999999; justify-content: center; align-items: center;">
  <div class="modal-card" style="max-width: 440px; width: 90%; text-align: center; padding: 28px 24px; background: #ffffff; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.05); border: 1px solid #e4e4e7; box-sizing: border-box; margin: auto;">
    <div style="width: 56px; height: 56px; background: #fee2e2; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; color: #dc2626; font-size: 22px;">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h2 style="font-size: 1.2rem; font-weight: 700; color: #09090b; margin: 0 0 8px 0;">Confirm Deletion</h2>
    <p id="expoDeleteModalText" style="font-size: 0.9rem; color: #71717a; margin: 0 0 24px 0; line-height: 1.5;">Are you sure you want to delete this item? This action cannot be undone.</p>
    <form id="expoDeleteModalForm" method="POST" style="display: none;">
      {% csrf_token %}
    </form>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <button type="button" class="btn-expo-secondary" onclick="closeExpoDeleteModal()" style="flex: 1; padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">Cancel</button>
      <button type="button" id="expoDeleteConfirmBtn" class="btn-expo-danger" style="flex: 1; padding: 10px 16px; background: #dc2626; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s ease;">Delete</button>
    </div>
  </div>
</div>

<script>
let pendingDeleteTarget = null;
let isPostFormDelete = false;

function confirmExpoDelete(urlOrForm, itemName, isPost = false) {
  const modal = document.getElementById('expoDeleteModal');
  const textEl = document.getElementById('expoDeleteModalText');
  const confirmBtn = document.getElementById('expoDeleteConfirmBtn');
  
  if (itemName) {
    textEl.textContent = `Are you sure you want to delete "${itemName}"? This action cannot be undone.`;
  } else {
    textEl.textContent = 'Are you sure you want to delete this item? This action cannot be undone.';
  }

  pendingDeleteTarget = urlOrForm;
  isPostFormDelete = isPost;

  confirmBtn.onclick = function() {
    if (isPostFormDelete && typeof pendingDeleteTarget === 'object' && pendingDeleteTarget.submit) {
      pendingDeleteTarget.submit();
    } else if (typeof pendingDeleteTarget === 'string') {
      if (isPost) {
        const form = document.getElementById('expoDeleteModalForm');
        form.action = pendingDeleteTarget;
        form.submit();
      } else {
        window.location.href = pendingDeleteTarget;
      }
    }
  };

  modal.style.display = 'flex';
}

function closeExpoDeleteModal() {
  const modal = document.getElementById('expoDeleteModal');
  if (modal) modal.style.display = 'none';
}

window.addEventListener('click', function(e) {
  const modal = document.getElementById('expoDeleteModal');
  if (e.target === modal) closeExpoDeleteModal();
});

window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeExpoDeleteModal();
});
</script>
